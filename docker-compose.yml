services:
  db:
    image: postgres:16
    container_name: rtoshield-db
    environment:
      POSTGRES_DB: rtoshield
      POSTGRES_USER: rto
      POSTGRES_PASSWORD: rto
    ports:
      - "5433:5432"     # 5433 on your laptop, so it never clashes with a local PostgreSQL on 5432
    volumes:
      - rtoshield-data:/var/lib/postgresql/data

volumes:
  rtoshield-data:
